# Builds the DoYouCopy installer from the source code, on GitHub-hosted runners only:
# the binaries signed later (SignPath Foundation) must come from this automated build.
# Every push and pull request: lint, tests, installer and Microsoft Store package (MSIX)
# as downloadable artifacts. The MSIX is not signed: it is uploaded to Partner Center
# by hand, and the Store signs it (docs/STORE.fr.md).
# A v* tag: both are also attached to a draft release, to check then publish.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      # Actions pinned to a commit: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Environment (locked versions, SHA-256 checked)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --require-hashes --no-deps -r requirements\build.txt
          .venv\Scripts\python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint
        run: .venv\Scripts\python -m ruff check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Installer
        run: powershell -ExecutionPolicy Bypass -File scripts\build_installer.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: dist/DoYouCopy-Setup-*.exe
          if-no-files-found: error

      - name: Microsoft Store package (MSIX)
        run: powershell -ExecutionPolicy Bypass -File scripts\build_msix.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix
          path: dist/DoYouCopy-*-x64.msix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the draft release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msix
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum DoYouCopy-Setup-*.exe DoYouCopy-*-x64.msix > SHA256SUMS.txt
          gh release create "$TAG" DoYouCopy-Setup-*.exe DoYouCopy-*-x64.msix SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --title "DoYouCopy ${TAG#v}" --generate-notes
