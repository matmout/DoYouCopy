[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doyoucopy"
dynamic = ["version"]
description = "Transcription vocale locale (faster-whisper + ROCm) pour Windows"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # ctranslate2 (pulled in by faster-whisper) must be the ROCm wheel:
    # install with `pip install -c constraints.txt -e .` after scripts/install_rocm.ps1.
    "faster-whisper>=1.1",
    # PyAV 19 removed av.open(metadata_errors=...), still used by faster-whisper 1.2.1.
    "av>=11,<19",
    "PySide6>=6.8",
    "qtawesome>=1.4",  # Phosphor icons
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
doyoucopy = "doyoucopy.app:main"

[tool.setuptools.dynamic]
version = { attr = "doyoucopy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doyoucopy.ui" = ["resources/fonts/*.ttf", "resources/fonts/OFL.txt"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Errors, likely bugs and modern syntax; no pure style rules (the code has its own style).
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "PLE", "PLW"]
ignore = [
    "E501",    # long lines: some French messages read better unbroken
    "RUF001",  # ambiguous unicode: « », ’ and … are intended in French texts
    "RUF002",
    "RUF003",
    "SIM105",  # try / except / pass reads as plainly as contextlib.suppress
    "SIM108",  # ternaries are not always clearer
    "PLW0108", # Qt slots: a lambda drops the signal's arguments on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # QT_QPA_PLATFORM must be set before importing PySide6
"scripts/snapshot_ui.py" = ["B023"]  # shot() is called inside its own loop iteration

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the ROCm GPU and downloads a Whisper model",
    "hardware: plays a sound and captures it (Windows audio devices)",
]
addopts = "-m 'not gpu and not hardware'"
