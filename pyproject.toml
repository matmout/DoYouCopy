[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mywhisper"
version = "0.1.0"
description = "Transcription vocale locale (faster-whisper + ROCm) pour Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ctranslate2 (pulled in by faster-whisper) must be the ROCm wheel:
    # install with `pip install -c constraints.txt -e .` after scripts/install_rocm.ps1.
    "faster-whisper>=1.1",
    # PyAV 19 removed av.open(metadata_errors=...), still used by faster-whisper 1.2.1.
    "av>=11,<19",
    "PySide6>=6.8",
    "qtawesome>=1.4",  # Phosphor icons
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mywhisper = "mywhisper.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mywhisper.ui" = ["resources/fonts/*.ttf", "resources/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the ROCm GPU and downloads a Whisper model"]
addopts = "-m 'not gpu'"
