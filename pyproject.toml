[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mywhisper"
dynamic = ["version"]
description = "Transcription vocale locale (faster-whisper + ROCm) pour Windows"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # ctranslate2 (pulled in by faster-whisper) must be the ROCm wheel:
    # install with `pip install -c constraints.txt -e .` after scripts/install_rocm.ps1.
    "faster-whisper>=1.1",
    # PyAV 19 removed av.open(metadata_errors=...), still used by faster-whisper 1.2.1.
    "av>=11,<19",
    "PySide6>=6.8",
    "qtawesome>=1.4",  # Phosphor icons
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
mywhisper = "mywhisper.app:main"

[tool.setuptools.dynamic]
version = { attr = "mywhisper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mywhisper.ui" = ["resources/fonts/*.ttf", "resources/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the ROCm GPU and downloads a Whisper model",
    "hardware: plays a sound and captures it (Windows audio devices)",
]
addopts = "-m 'not gpu and not hardware'"
